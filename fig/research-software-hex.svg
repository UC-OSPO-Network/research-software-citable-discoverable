<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 545" font-family="'Helvetica Neue',Arial,sans-serif" role="img" aria-label="Core Elements of Citable and Discoverable Research Software: six hexagons in two categories. Blue (Citable): Release and DOI, CITATION.cff, License. Green (Discoverable): Metadata and Topics, README and Docs, Public Archive.">
  <defs>
    <filter id="hexShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0b1b33" flood-opacity="0.20"/>
    </filter>
  </defs>

  <!-- Self-contained card: fixed light background so the graphic reads correctly on any page theme -->
  <rect x="6" y="6" width="988" height="533" rx="26" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="2"/>

  <!-- Title -->
  <g fill="#1A2B4A" font-weight="700" font-size="40" text-anchor="middle">
    <text x="500" y="66">Core Elements of Citable &amp;</text>
    <text x="500" y="112">Discoverable Research Software</text>
  </g>

  <!-- ================= BOTTOM ROW (green, drawn first) ================= -->

  <!-- Metadata & Topics -->
  <g>
    <polygon points="244,421 286,348 370,348 412,421 370,494 286,494" fill="#4C9A2A" stroke="#fff" stroke-width="5" filter="url(#hexShadow)"/>
    <g transform="translate(328,401)" fill="none" stroke="#fff" stroke-width="4" stroke-linejoin="round">
      <path d="M-24,0 L-8,-16 H16 a6,6 0 0 1 6,6 V10 a6,6 0 0 1 -6,6 H-8 Z" transform="translate(4,-9)"/>
      <path d="M-24,0 L-8,-16 H16 a6,6 0 0 1 6,6 V10 a6,6 0 0 1 -6,6 H-8 Z"/>
      <circle cx="-6" cy="0" r="3.5" stroke-width="3"/>
    </g>
    <g fill="#fff" font-weight="700" font-size="20" text-anchor="middle">
      <text x="328" y="447">Metadata</text>
      <text x="328" y="471">&amp; Topics</text>
    </g>
  </g>

  <!-- README & Docs -->
  <g>
    <polygon points="416,421 458,348 542,348 584,421 542,494 458,494" fill="#4C9A2A" stroke="#fff" stroke-width="5" filter="url(#hexShadow)"/>
    <g transform="translate(500,398)" fill="none" stroke="#fff" stroke-width="4" stroke-linejoin="round">
      <path d="M0,-15 C-8,-21 -19,-21 -25,-17 V15 C-19,11 -8,11 0,17 C8,11 19,11 25,15 V-17 C19,-21 8,-21 0,-15 Z"/>
      <path d="M0,-15 V17"/>
      <path d="M-19,-9 h12 M-19,-2 h12 M-19,5 h12 M7,-9 h12 M7,-2 h12 M7,5 h12" stroke-width="2.4"/>
    </g>
    <g fill="#fff" font-weight="700" font-size="20" text-anchor="middle">
      <text x="500" y="447">README</text>
      <text x="500" y="471">&amp; Docs</text>
    </g>
  </g>

  <!-- Public Archive -->
  <g>
    <polygon points="588,421 630,348 714,348 756,421 714,494 630,494" fill="#4C9A2A" stroke="#fff" stroke-width="5" filter="url(#hexShadow)"/>
    <g transform="translate(672,400)" fill="none" stroke="#fff" stroke-width="4" stroke-linejoin="round">
      <rect x="-25" y="-20" width="50" height="13" rx="3"/>
      <rect x="-21" y="-7" width="42" height="27" rx="3"/>
      <path d="M-7,2 h14" stroke-linecap="round"/>
    </g>
    <g fill="#fff" font-weight="700" font-size="20" text-anchor="middle">
      <text x="672" y="447">Public</text>
      <text x="672" y="471">Archive</text>
    </g>
  </g>

  <!-- ================= MIDDLE ROW (blue) ================= -->

  <!-- CITATION.cff -->
  <g>
    <polygon points="330,313 372,240 456,240 498,313 456,386 372,386" fill="#2C6FB5" stroke="#fff" stroke-width="5" filter="url(#hexShadow)"/>
    <g transform="translate(414,290)">
      <path d="M-19,-26 H7 L21,-12 V24 a4,4 0 0 1 -4,4 H-19 a4,4 0 0 1 -4,-4 V-22 a4,4 0 0 1 4,-4 Z" fill="none" stroke="#fff" stroke-width="4" stroke-linejoin="round"/>
      <path d="M7,-26 V-12 H21" fill="none" stroke="#fff" stroke-width="4" stroke-linejoin="round"/>
      <path d="M-11,0 h9 v8 q0,7 -7,9 l-1.5,-3 q3,-1.5 3,-5 h-3.5 z M2,0 h9 v8 q0,7 -7,9 l-1.5,-3 q3,-1.5 3,-5 h-3.5 z" fill="#fff"/>
    </g>
    <text x="414" y="349" fill="#fff" font-weight="700" font-size="20" text-anchor="middle">CITATION.cff</text>
  </g>

  <!-- License -->
  <g>
    <polygon points="502,313 544,240 628,240 670,313 628,386 544,386" fill="#2C6FB5" stroke="#fff" stroke-width="5" filter="url(#hexShadow)"/>
    <g transform="translate(586,290)">
      <path d="M0,-27 L19,-19 V-3 Q19,19 0,29 Q-19,19 -19,-3 V-19 Z" fill="none" stroke="#fff" stroke-width="4" stroke-linejoin="round"/>
      <path d="M-9,-1 L-2,7 L11,-10" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="586" y="349" fill="#fff" font-weight="700" font-size="20" text-anchor="middle">License</text>
  </g>

  <!-- ================= TOP (blue, drawn last so it overlaps cleanly) ================= -->

  <!-- Release & DOI -->
  <g>
    <polygon points="416,205 458,132 542,132 584,205 542,278 458,278" fill="#2C6FB5" stroke="#fff" stroke-width="5" filter="url(#hexShadow)"/>
    <g transform="translate(500,183)">
      <circle r="22" fill="none" stroke="#fff" stroke-width="4"/>
      <text y="7" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">DOI</text>
    </g>
    <g fill="#fff" font-weight="700" font-size="20" text-anchor="middle">
      <text x="500" y="231">Release</text>
      <text x="500" y="255">&amp; DOI</text>
    </g>
  </g>

  <!-- ================= LEGEND ================= -->
  <g font-weight="700" font-size="19" text-anchor="middle">
    <rect x="346" y="505" width="118" height="30" rx="15" fill="#2C6FB5"/>
    <text x="405" y="525" fill="#fff">Citable</text>
    <rect x="478" y="505" width="178" height="30" rx="15" fill="#4C9A2A"/>
    <text x="567" y="525" fill="#fff">Discoverable</text>
  </g>
</svg>
